<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Craft</title>
  <style>
    :root {
      --bg: #7cc7ff;
      --panel: #1f2937;
      --panel-border: #111827;
      --text: #f3f4f6;
      --accent: #f59e0b;
      --grass: #55aa33;
      --dirt: #8b5a2b;
      --stone: #6b7280;
      --wood: #7c4a22;
      --sand: #d9c27f;
      --water: #3b82f6;
      --leaves: #2f8f2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(to bottom, var(--bg), #dff2ff);
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .app {
      width: min(1000px, 100%);
      background: rgba(17, 24, 39, 0.92);
      border: 3px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .title {
      font-size: clamp(1.1rem, 2.8vw, 1.8rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 2px 2px #111;
    }

    .subtitle {
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--panel);
      border: 2px solid #374151;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .world-wrap {
      background: #0b1220;
      border: 3px solid #000;
      border-radius: 8px;
      overflow: auto;
      max-height: 66vh;
    }

    #world {
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
      cursor: crosshair;
      background: linear-gradient(to bottom, #74c0ff 0%, #bde3ff 58%, #b5d0b7 58.1%, #7f9f73 100%);
    }

    .toolbar {
      display: grid;
      gap: 8px;
    }

    .hotbar {
      display: grid;
      grid-template-columns: repeat(7, minmax(40px, 1fr));
      gap: 6px;
    }

    .slot {
      border: 2px solid #4b5563;
      background: #111827;
      border-radius: 6px;
      min-height: 52px;
      display: grid;
      place-items: center;
      font-weight: 700;
      position: relative;
      user-select: none;
    }

    .slot.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px #facc15;
    }

    .slot small {
      position: absolute;
      top: 4px;
      left: 5px;
      font-size: 0.7rem;
      color: #9ca3af;
    }

    .controls {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .controls b { color: #fcd34d; }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div>
        <div class="title">Mini Craft</div>
        <div class="subtitle">A compact block-building sandbox inspired by Minecraft.</div>
      </div>
      <div class="stats">
        <div class="chip" id="clock">Time: Day</div>
        <div class="chip" id="selected">Selected: Grass</div>
      </div>
    </section>

    <section class="world-wrap">
      <canvas id="world" width="960" height="540" aria-label="Mini Craft world"></canvas>
    </section>

    <section class="toolbar">
      <div class="hotbar" id="hotbar"></div>
      <div class="controls">
        <div><b>Place Block:</b> Left click</div>
        <div><b>Break Block:</b> Right click</div>
        <div><b>Select Block:</b> Number keys 1-7 (or click a slot)</div>
      </div>
    </section>
  </main>

  <script>
    const TILE = 24;
    const COLS = 40;
    const ROWS = 22;
    const SURFACE = 12;

    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const selectedText = document.getElementById('selected');
    const clockText = document.getElementById('clock');
    const hotbar = document.getElementById('hotbar');

    const blockTypes = [
      { key: 'grass', label: 'Grass', color: getCss('--grass') },
      { key: 'dirt', label: 'Dirt', color: getCss('--dirt') },
      { key: 'stone', label: 'Stone', color: getCss('--stone') },
      { key: 'wood', label: 'Wood', color: getCss('--wood') },
      { key: 'sand', label: 'Sand', color: getCss('--sand') },
      { key: 'water', label: 'Water', color: getCss('--water') },
      { key: 'leaves', label: 'Leaves', color: getCss('--leaves') }
    ];

    const world = Array.from({ length: ROWS }, (_, y) =>
      Array.from({ length: COLS }, (_, x) => {
        if (y < SURFACE) return null;
        if (y === SURFACE) return 'grass';
        if (y <= SURFACE + 3) return 'dirt';
        if (Math.random() < 0.15 && y > SURFACE + 5) return 'stone';
        return 'dirt';
      })
    );

    // Simple mini lakes and trees.
    for (let i = 0; i < 8; i++) {
      const x = rand(1, COLS - 2);
      for (let y = SURFACE - 1; y <= SURFACE + 1; y++) {
        if (world[y] && world[y][x]) world[y][x] = 'water';
      }
    }

    for (let i = 0; i < 6; i++) {
      const x = rand(2, COLS - 3);
      const trunkBase = SURFACE - 1;
      world[trunkBase][x] = 'wood';
      world[trunkBase - 1][x] = 'wood';
      for (let ly = trunkBase - 3; ly <= trunkBase - 1; ly++) {
        for (let lx = x - 1; lx <= x + 1; lx++) {
          if (world[ly] && world[ly][lx] === null) world[ly][lx] = 'leaves';
        }
      }
    }

    let selectedIndex = 0;
    let day = true;

    function buildHotbar() {
      hotbar.innerHTML = '';
      blockTypes.forEach((block, i) => {
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'slot' + (i === selectedIndex ? ' active' : '');
        slot.innerHTML = `<small>${i + 1}</small>${block.label}`;
        slot.style.color = block.color;
        slot.addEventListener('click', () => {
          selectedIndex = i;
          updateHud();
          buildHotbar();
        });
        hotbar.appendChild(slot);
      });
    }

    function updateHud() {
      selectedText.textContent = `Selected: ${blockTypes[selectedIndex].label}`;
      clockText.textContent = `Time: ${day ? 'Day' : 'Night'}`;
      canvas.style.filter = day ? 'brightness(1)' : 'brightness(0.72) saturate(0.9)';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const blockKey = world[y][x];
          if (!blockKey) continue;
          const block = blockTypes.find(b => b.key === blockKey);
          if (!block) continue;

          ctx.fillStyle = block.color;
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
          ctx.strokeStyle = 'rgba(0,0,0,0.2)';
          ctx.strokeRect(x * TILE + 0.5, y * TILE + 0.5, TILE - 1, TILE - 1);

          // Simple top shading for depth.
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(x * TILE, y * TILE, TILE, 3);
        }
      }
      requestAnimationFrame(draw);
    }

    function placeOrBreak(event, breaking) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left) / TILE);
      const y = Math.floor((event.clientY - rect.top) / TILE);

      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

      if (breaking) {
        world[y][x] = null;
      } else {
        world[y][x] = blockTypes[selectedIndex].key;
      }
    }

    canvas.addEventListener('click', (e) => placeOrBreak(e, false));
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      placeOrBreak(e, true);
    });

    window.addEventListener('keydown', (e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= blockTypes.length) {
        selectedIndex = n - 1;
        buildHotbar();
        updateHud();
      }

      if (e.key.toLowerCase() === 't') {
        day = !day;
        updateHud();
      }
    });

    setInterval(() => {
      day = !day;
      updateHud();
    }, 12000);

    function getCss(varName) {
      return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    }

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    buildHotbar();
    updateHud();
    draw();
  </script>
</body>
</html>
